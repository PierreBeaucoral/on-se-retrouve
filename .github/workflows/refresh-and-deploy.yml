name: Refresh rail tables and deploy

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC: new SNCF GTFS, every weekend in its horizon
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Tests, types, lint
        run: |
          npm test
          npm run typecheck
          npm run lint

      # The rail tables are generated here, not committed: about 70 dates x 300 KB per refresh
      # would bloat the repository. Pushes within the same week reuse the cached tables.
      - name: Week stamp
        id: week
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore this week's rail tables
        id: cache
        if: github.event_name == 'push'
        uses: actions/cache/restore@v4
        with:
          path: public/rail
          key: rail-${{ steps.week.outputs.week }}
          restore-keys: rail-${{ steps.week.outputs.week }}-

      - name: Refresh rail tables from the SNCF open GTFS feed
        if: github.event_name != 'push' || steps.cache.outputs.cache-matched-key == ''
        run: npm run rail

      - name: Save rail tables for this week
        if: github.event_name != 'push' || steps.cache.outputs.cache-matched-key == ''
        uses: actions/cache/save@v4
        with:
          path: public/rail
          key: rail-${{ steps.week.outputs.week }}-${{ github.run_id }}

      - name: Check tables
        run: |
          test -f public/rail/index.json
          node -e "const i=require('./public/rail/index.json');console.log(i.feedVersion, i.dates.length+' dates', i.dates[0], '→', i.dates.at(-1))"

      - name: Build site
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
