name: Refresh rail tables and deploy

on:
  schedule:
    - cron: "0 5 * * 1" # Mondays 05:00 UTC: new SNCF GTFS, next eight weekends
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Tests, types, lint
        run: |
          npm test
          npm run typecheck
          npm run lint

      - name: Refresh rail tables from the SNCF open GTFS feed
        # Scheduled and manual runs recompute the tables; a plain push only rebuilds the site
        # unless the tables are missing, so code changes deploy fast.
        if: github.event_name != 'push' || hashFiles('public/rail/index.json') == ''
        run: npm run rail

      - name: Commit refreshed tables
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/rail
          if git diff --cached --quiet; then
            echo "Rail tables unchanged."
          else
            git commit -m "Refresh rail tables from SNCF GTFS ($(date -u +%Y-%m-%d))"
            git push
          fi

      - name: Build site
        run: npm run build

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
